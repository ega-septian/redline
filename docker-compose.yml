services:
  db:
    image: postgres:16-alpine
    container_name: redline-db
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline
      POSTGRES_DB: redline
    ports:
      - "5433:5432" # 5432 sudah dipakai Carikan
    volumes:
      - redline-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline -d redline"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  redline-db:
